name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime

          api_key = os.environ["FRED_API_KEY"]


          def fetch_fred_observations(series_id, limit=60):
              params = {
                  "series_id": series_id,
                  "api_key": api_key,
                  "file_type": "json",
                  "sort_order": "desc",
                  "limit": limit
              }

              url = (
                  "https://api.stlouisfed.org/fred/series/observations?"
                  + urllib.parse.urlencode(params)
              )

              with urllib.request.urlopen(url) as response:
                  fred_data = json.load(response)

              return [
                  observation
                  for observation in fred_data["observations"]
                  if observation["value"] != "."
              ]


          def get_latest_fred_value(series_id):
              observations = fetch_fred_observations(
                  series_id,
                  limit=10
              )

              if not observations:
                  raise RuntimeError(
                      f"No valid observation found for {series_id}"
                  )

              latest = observations[0]

              return {
                  "value": float(latest["value"]),
                  "date": latest["date"]
              }


          def get_latest_with_change_percent(series_id):
              observations = fetch_fred_observations(
                  series_id,
                  limit=10
              )

              if len(observations) < 2:
                  raise RuntimeError(
                      f"Not enough observations for {series_id}"
                  )

              latest = observations[0]
              previous = observations[1]

              latest_value = float(latest["value"])
              previous_value = float(previous["value"])

              change_percent = (
                  (latest_value / previous_value) - 1
              ) * 100

              return {
                  "value": round(latest_value, 2),
                  "date": latest["date"],
                  "changePercent": round(change_percent, 2)
              }


          def get_yoy_history(series_id, count=4):
              observations = fetch_fred_observations(
                  series_id,
                  limit=40
              )

              values_by_date = {
                  observation["date"]:
                  float(observation["value"])
                  for observation in observations
              }

              results = []

              for observation in observations:

                  current_date = datetime.strptime(
                      observation["date"],
                      "%Y-%m-%d"
                  )

                  try:
                      year_ago_date = current_date.replace(
                          year=current_date.year - 1
                      ).strftime("%Y-%m-%d")
                  except ValueError:
                      continue

                  if year_ago_date not in values_by_date:
                      continue

                  current_value = float(
                      observation["value"]
                  )

                  year_ago_value = values_by_date[
                      year_ago_date
                  ]

                  yoy = (
                      (current_value / year_ago_value) - 1
                  ) * 100

                  results.append({
                      "value": round(yoy, 2),
                      "date": observation["date"]
                  })

                  if len(results) >= count:
                      break

              if not results:
                  raise RuntimeError(
                      f"No YoY history found for {series_id}"
                  )

              return results


          def get_yoy_fred_value(series_id):

              history = get_yoy_history(
                  series_id,
                  count=4
              )

              latest = history[0]

              return {
                  "value": latest["value"],
                  "date": latest["date"],
                  "history": history
              }


          def get_value_with_history(
              series_id,
              history_count=5
          ):

              observations = fetch_fred_observations(
                  series_id,
                  limit=max(history_count + 10, 20)
              )

              if not observations:
                  raise RuntimeError(
                      f"No valid observation found for {series_id}"
                  )

              history = []

              for observation in observations[
                  :history_count
              ]:

                  history.append({
                      "value": float(
                          observation["value"]
                      ),
                      "date": observation["date"]
                  })


              return {
                  "value": history[0]["value"],
                  "date": history[0]["date"],
                  "history": history
              }


          def get_monthly_change_history(
              series_id,
              count=4
          ):

              observations = fetch_fred_observations(
                  series_id,
                  limit=count + 5
              )

              if len(observations) < 2:
                  raise RuntimeError(
                      f"Not enough observations for {series_id}"
                  )

              history = []

              max_changes = min(
                  count,
                  len(observations) - 1
              )

              for i in range(max_changes):

                  latest = observations[i]
                  previous = observations[i + 1]

                  change = (
                      float(latest["value"])
                      - float(previous["value"])
                  )

                  history.append({
                      "value": round(change, 0),
                      "date": latest["date"]
                  })


              return {
                  "value": history[0]["value"],
                  "date": history[0]["date"],
                  "history": history
              }


          # =========================
          # 股票市场 Stock Market
          # =========================

          sp500 = get_latest_with_change_percent(
              "SP500"
          )

          nasdaq = get_latest_with_change_percent(
              "NASDAQCOM"
          )


          # =========================
          # 利率 Interest Rates
          # =========================

          fed_rate = get_latest_fred_value(
              "DFF"
          )

          treasury2 = get_value_with_history(
              "DGS2",
              history_count=6
          )

          treasury10 = get_value_with_history(
              "DGS10",
              history_count=6
          )

          real_yield10 = get_value_with_history(
              "DFII10",
              history_count=6
          )


          # =========================
          # 通胀 Inflation
          # =========================

          cpi = get_yoy_fred_value(
              "CPIAUCSL"
          )

          core_cpi = get_yoy_fred_value(
              "CPILFESL"
          )

          core_pce = get_yoy_fred_value(
              "PCEPILFE"
          )


          # =========================
          # 经济 Economy
          # =========================

          unemployment = get_value_with_history(
              "UNRATE",
              history_count=4
          )

          payrolls = get_monthly_change_history(
              "PAYEMS",
              count=4
          )

          claims = get_value_with_history(
              "ICSA",
              history_count=5
          )


          # =========================
          # 市场风险 Market Risk
          # =========================

          hy_spread = get_value_with_history(
              "BAMLH0A0HYM2",
              history_count=6
          )

          wti = get_latest_fred_value(
              "DCOILWTICO"
          )

          broad_dollar = get_latest_fred_value(
              "DTWEXBGS"
          )

          vix = get_value_with_history(
              "VIXCLS",
              history_count=6
          )


          # =========================
          # 输出 data.json
          # =========================

          output = {

              "sp500": sp500,
              "nasdaq": nasdaq,

              "fedRate": fed_rate,
              "treasury2": treasury2,
              "treasury10": treasury10,
              "realYield10": real_yield10,

              "cpi": cpi,
              "coreCpi": core_cpi,
              "corePce": core_pce,

              "unemployment": unemployment,
              "payrolls": payrolls,
              "claims": claims,

              "hySpread": hy_spread,
              "wti": wti,
              "broadDollar": broad_dollar,
              "vix": vix
          }


          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              )
          )

          PY


      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market data with trend history"
            git push
          fi
