name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * 1-5"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest market data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime

          api_key = os.environ["FRED_API_KEY"]


          def fetch_fred_observations(series_id, limit=40):
              params = {
                  "series_id": series_id,
                  "api_key": api_key,
                  "file_type": "json",
                  "sort_order": "desc",
                  "limit": limit
              }

              url = (
                  "https://api.stlouisfed.org/fred/series/observations?"
                  + urllib.parse.urlencode(params)
              )

              with urllib.request.urlopen(url) as response:
                  fred_data = json.load(response)

              return [
                  observation
                  for observation in fred_data["observations"]
                  if observation["value"] != "."
              ]


          def get_latest_fred_value(series_id):
              observations = fetch_fred_observations(
                  series_id,
                  limit=10
              )

              if not observations:
                  raise RuntimeError(
                      f"No valid observation found for {series_id}"
                  )

              latest = observations[0]

              return {
                  "value": float(latest["value"]),
                  "date": latest["date"]
              }


          def get_yoy_fred_value(series_id):
              observations = fetch_fred_observations(
                  series_id,
                  limit=30
              )

              if not observations:
                  raise RuntimeError(
                      f"No valid observation found for {series_id}"
                  )

              latest = observations[0]

              latest_date = datetime.strptime(
                  latest["date"],
                  "%Y-%m-%d"
              )

              year_ago_date = latest_date.replace(
                  year=latest_date.year - 1
              ).strftime("%Y-%m-%d")


              values_by_date = {
                  observation["date"]:
                  float(observation["value"])
                  for observation in observations
              }


              if year_ago_date not in values_by_date:
                  raise RuntimeError(
                      f"Missing year-ago observation for {series_id}"
                  )


              latest_value = float(latest["value"])
              year_ago_value = values_by_date[year_ago_date]


              yoy = (
                  (latest_value / year_ago_value) - 1
              ) * 100


              return {
                  "value": round(yoy, 2),
                  "date": latest["date"]
              }


          # -------------------------
          # 利率 Interest Rates
          # -------------------------

          fed_rate = get_latest_fred_value("DFF")

          treasury2 = get_latest_fred_value("DGS2")

          treasury10 = get_latest_fred_value("DGS10")

          real_yield10 = get_latest_fred_value("DFII10")


          # -------------------------
          # 通胀 Inflation
          # -------------------------

          cpi = get_yoy_fred_value("CPIAUCSL")

          core_cpi = get_yoy_fred_value("CPILFESL")

          core_pce = get_yoy_fred_value("PCEPILFE")


          # -------------------------
          # 输出 data.json
          # -------------------------

          output = {
              "fedRate": fed_rate,
              "treasury2": treasury2,
              "treasury10": treasury10,
              "realYield10": real_yield10,

              "cpi": cpi,
              "coreCpi": core_cpi,
              "corePce": core_pce
          }


          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print(output)

          PY


      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update market data"
            git push
          fi
